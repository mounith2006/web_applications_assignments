<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>

    <h2>Multiplication Table</h2>

    <script>
        let number = 5;

        document.write("<h3>Multiplication Table of " + number + "</h3>");

        for (let i = 1; i <= 10; i++) {
            document.write(number + " × " + i + " = " + (number * i) + "<br>");
        }
    </script>

</body>
</html>
