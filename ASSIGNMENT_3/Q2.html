<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Operations</title>
</head>
<body>

    <h2>Arithmetic Operations</h2>

    <script>
        let a = 20;
        let b = 5;

        // Addition
        function add(x, y) {
            return x + y;
        }

        // Subtraction
        function subtract(x, y) {
            return x - y;
        }

        // Multiplication
        function multiply(x, y) {
            return x * y;
        }

        // Division
        function divide(x, y) {
            return x / y;
        }

        // Modulus
        function modulus(x, y) {
            return x % y;
        }

        document.write("First Number: " + a + "<br>");
        document.write("Second Number: " + b + "<br><br>");

        document.write("Addition: " + add(a, b) + "<br>");
        document.write("Subtraction: " + subtract(a, b) + "<br>");
        document.write("Multiplication: " + multiply(a, b) + "<br>");
        document.write("Division: " + divide(a, b) + "<br>");
        document.write("Modulus: " + modulus(a, b) + "<br>");
    </script>

</body>
</html>
