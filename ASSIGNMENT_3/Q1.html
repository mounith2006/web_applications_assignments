<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Data Types</title>
</head>
<body>

    <h2>JavaScript Variables and Data Types</h2>

    <script>
        let name = "Mounith";              // String
        let age = 20;                      // Number
        let isStudent = true;              // Boolean
        let subjects = ["Java", "HTML", "JavaScript"]; // Array
        let student = {                    // Object
            course: "CSE",
            year: 3
};
        let address = null;                // Null

        document.write("Name: " + name + "<br>");
        document.write("Age: " + age + "<br>");
        document.write("Student: " + isStudent + "<br>");
        document.write("Subjects: " + subjects + "<br>");
        document.write("Course: " + student.course + "<br>");
        document.write("Year: " + student.year + "<br>");
        document.write("Address: " + address + "<br>");
    </script>

</body>
</html>
