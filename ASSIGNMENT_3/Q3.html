<!DOCTYPE html>
<html>
<head>
    <title>Rectangle Area and Perimeter</title>
</head>
<body>

    <h2>Area and Perimeter of Rectangle</h2>

    <script>
        let length = 10;
        let breadth = 5;

        // Function to calculate area
        function area(l, b) {
            return l * b;
        }

        // Function to calculate perimeter
        function perimeter(l, b) {
            return 2 * (l + b);
        }

        document.write("Length: " + length + "<br>");
        document.write("Breadth: " + breadth + "<br><br>");

        document.write("Area: " + area(length, breadth) + "<br>");
        document.write("Perimeter: " + perimeter(length, breadth));
    </script>

</body>
</html>
