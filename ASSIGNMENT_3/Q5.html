<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>
</head>
<body>

    <h2>Even or Odd Number</h2>

    <script>
        let number = 15;

        if (number % 2 == 0) {
            document.write(number + " is an Even number");
        } 
        else {
            document.write(number + " is an Odd number");
        }
    </script>

</body>
</html>
