<!DOCTYPE html>
<html>
<head>
    <title>Simple Counter</title>
</head>
<body>

    <h2>Simple Counter</h2>

    <h3 id="count">0</h3>

    <button onclick="increment()">Increment</button>
    <button onclick="decrement()">Decrement</button>

    <script>
        let count = 0;

        function increment() {
            count++;
            document.getElementById("count").innerHTML = count;
        }

        function decrement() {
            count--;
            document.getElementById("count").innerHTML = count;
        }
    </script>

</body>
</html>
